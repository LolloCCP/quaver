[package]
name = "quaver"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Pinned: 0.8.0 on crates.io lacks the Spirc queue API and the CDN retry fix.
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
librespot-oauth = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
cpal = "0.16"
env_logger = { version = "0.11", default-features = false }
form_urlencoded = "1"
log = "0.4"
protobuf = "3.7"
protobuf-json-mapping = "3.7"
raw-window-handle = "0.6"
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "system-tray", "raw-window-handle-06", "unstable-winit-030"] }
souvlaki = "0.9"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "process"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
rand = "0.9"
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }

[build-dependencies]
slint-build = "1.19"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

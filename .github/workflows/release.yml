# Every push to main becomes a release, which Rustbeat installs by itself.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: windows-latest
    env:
      RUSTBEAT_VERSION: v0.1.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      # Nothing else has to be installed for it to run.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup update stable --no-self-update
      # Left out: needs a real screen, and a speed that shared machines don't have.
      - run: cargo test --locked -- --skip frames_are_made_for_the_next_refresh --skip painting_a_full_screen_is_quick
      - run: cargo build --release --locked
      - name: Installer
        run: |
          choco install innosetup --yes --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$env:RUSTBEAT_VERSION" installer.iss
          if ($LASTEXITCODE) { exit 1 }
      - name: Try the installer
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Rustbeat"
          Start-Process target\release\rustbeatinstaller.exe '/VERYSILENT /SUPPRESSMSGBOXES' -Wait
          if (-not (Test-Path $app\rustbeat.exe)) { throw 'not installed' }
          Start-Process $app\unins000.exe '/VERYSILENT /SUPPRESSMSGBOXES' -Wait
          if (Test-Path $app\rustbeat.exe) { throw 'not uninstalled' }
      - run: |
          git log -1 --format=%B | Out-File notes.md -Encoding utf8
          gh release create $env:RUSTBEAT_VERSION target/release/rustbeat.exe target/release/rustbeatinstaller.exe --target ${{ github.sha }} --title $env:RUSTBEAT_VERSION --notes-file notes.md
